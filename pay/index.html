<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Support Shijo — UPI</title>
<meta name="description" content="Support Shijo's work directly via UPI — works with any UPI app, no provider lock-in.">
<meta name="theme-color" content="#090b12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#090b12; --surface:#12141f; --border:#23263a; --border-2:#2e3149;
  --text:#f2f2f4; --muted:#9a9db3; --subtle:#5e6178;
  --accent:#8b7bff; --accent-2:#58e0c2;
  --font-display:'Space Grotesk',Arial,sans-serif;
  --font-body:'Inter',Arial,sans-serif;
  --font-mono:'JetBrains Mono',Menlo,monospace;
}
*{ box-sizing:border-box; }
body{
  margin:0; min-height:100vh; min-height:100svh;
  display:flex; justify-content:center; align-items:center;
  padding:24px; padding-top:calc(24px + env(safe-area-inset-top,0px));
  padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  background:var(--bg); color:var(--text); font-family:var(--font-body);
}
:focus-visible{ outline:2px solid var(--accent-2); outline-offset:3px; }
.container{ width:100%; max-width:460px; }
.back{
  display:inline-flex; align-items:center; gap:8px; margin-bottom:32px;
  color:var(--subtle); text-decoration:none; font-family:var(--font-mono);
  font-size:12px; letter-spacing:.08em; text-transform:uppercase;
}
.back:hover{ color:var(--accent-2); }
.eyebrow{
  font-family:var(--font-mono); font-size:12px; text-transform:uppercase;
  letter-spacing:.14em; color:var(--subtle); margin-bottom:10px;
}
h1{
  margin:0 0 12px; font-family:var(--font-display); font-weight:700;
  font-size:clamp(2rem,7vw,2.75rem); letter-spacing:-.02em; line-height:1.05;
}
.description{ color:var(--muted); line-height:1.6; margin:0; }
.card{
  margin-top:28px; padding:26px; border:1px solid var(--border); border-radius:14px;
  background:var(--surface); display:flex; flex-direction:column;
}
.pay-section{ order:1; }
.qr-section{ order:2; margin-top:26px; }
@media (min-width:640px){
  .pay-section{ order:2; margin-top:26px; }
  .qr-section{ order:1; margin-top:0; }
}
.amounts{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.amount{
  padding:14px 8px; border:1px solid var(--border-2); border-radius:8px;
  color:var(--text); background:var(--bg); cursor:pointer;
  font-family:var(--font-mono); font-size:15px; font-weight:500;
  transition:border-color .15s ease, background .15s ease, color .15s ease;
}
.amount:hover, .amount.selected{ border-color:var(--accent); background:rgba(139,123,255,.12); color:var(--accent-2); }
input{
  width:100%; margin-top:14px; padding:14px; border:1px solid var(--border-2);
  border-radius:8px; outline:none; color:var(--text); background:var(--bg);
  font-family:var(--font-mono); font-size:15px;
}
input::placeholder{ color:var(--subtle); }
.pay-button{
  width:100%; margin-top:16px; padding:16px; border:none; border-radius:8px;
  color:#0a0a0f; background:var(--accent-2); cursor:pointer;
  font-family:var(--font-mono); font-size:14px; font-weight:600; letter-spacing:.04em;
  text-transform:uppercase; transition:background .15s ease;
}
.pay-button:hover{ background:#79f0d6; }
.qr-caption{ margin:0 0 16px; color:var(--muted); font-weight:500; font-family:var(--font-mono); font-size:12.5px; letter-spacing:.04em; }
#qrcode{ display:inline-block; padding:12px; border-radius:10px; background:#fff; }
.upi-id{ margin:16px 0 8px; color:var(--accent-2); font-family:var(--font-mono); font-weight:500; font-size:13.5px; }
.copy-button{
  border:none; color:var(--subtle); background:transparent; cursor:pointer;
  text-decoration:underline; font-family:var(--font-mono); font-size:12.5px;
}
.copy-button:hover{ color:var(--accent-2); }
.note{ margin-top:22px; color:var(--subtle); font-size:12.5px; line-height:1.6; font-family:var(--font-mono); }
.status{ min-height:18px; margin:12px 0 0; font-size:13px; color:var(--accent-2); line-height:1.5; font-family:var(--font-mono); }
.visually-hidden{
  position:absolute; width:1px; height:1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap;
}
</style>
</head>
<body>
<div class="container">
  <a class="back" href="../">← Back to shijo.site</a>
  <div class="eyebrow">Support — UPI</div>
  <h1>Support my work</h1>
  <p class="description">Buy me a chaya :p — works with any UPI app, no provider lock-in.</p>

  <div class="card">
    <div class="pay-section">
      <div class="amounts" role="group" aria-label="Preset amounts">
        <button class="amount" data-amount="49" aria-pressed="false">₹49</button>
        <button class="amount selected" data-amount="99" aria-pressed="true">₹99</button>
        <button class="amount" data-amount="199" aria-pressed="false">₹199</button>
      </div>
      <label for="customAmount" class="visually-hidden">Custom amount in rupees</label>
      <input id="customAmount" type="number" min="1" inputmode="decimal" placeholder="Or enter a custom amount">
      <button class="pay-button" id="payButton" aria-describedby="payStatus">Pay ₹99 via UPI</button>
      <p class="status" id="payStatus" role="status" aria-live="polite"></p>
    </div>

    <div class="qr-section">
      <p class="qr-caption">Scan with any UPI app</p>
      <div id="qrcode" role="img" aria-label="UPI QR code for shijosylan@oksbi. Scan with Google Pay, PhonePe, Paytm, BHIM, or any UPI-enabled banking app."></div>
      <div class="upi-id">shijosylan@oksbi</div>
      <button class="copy-button" id="copyButton" aria-live="polite">Copy UPI ID</button>
    </div>

    <p class="note">On mobile, tap the payment button to open your UPI app. On desktop, scan the QR code with any UPI app on your phone.</p>
  </div>
</div>

<script>
const upiId = "shijosylan@oksbi";
const payeeName = "Shijo";
let selectedAmount = "99";

const amountButtons = document.querySelectorAll(".amount");
const customAmount = document.getElementById("customAmount");
const payButton = document.getElementById("payButton");
const qrCodeBox = document.getElementById("qrcode");
const copyButton = document.getElementById("copyButton");
const payStatus = document.getElementById("payStatus");

function isMobileDevice() {
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

function createUpiLink() {
  const amount = customAmount.value || selectedAmount;
  const params = new URLSearchParams({ pa: upiId, pn: payeeName, cu: "INR" });
  if (amount && Number(amount) > 0) params.set("am", amount);
  return "upi://pay?" + params.toString();
}

function updatePaymentDetails() {
  const amount = customAmount.value || selectedAmount;
  payButton.textContent = amount && Number(amount) > 0 ? `Pay ₹${amount} via UPI` : "Pay via UPI";
  qrCodeBox.innerHTML = "";
  new QRCode(qrCodeBox, {
    text: createUpiLink(),
    width: 176,
    height: 176,
    colorDark: "#0a0a0f",
    colorLight: "#ffffff"
  });
}

amountButtons.forEach(button => {
  button.addEventListener("click", () => {
    selectedAmount = button.dataset.amount;
    customAmount.value = "";
    amountButtons.forEach(item => { item.classList.remove("selected"); item.setAttribute("aria-pressed", "false"); });
    button.classList.add("selected");
    button.setAttribute("aria-pressed", "true");
    updatePaymentDetails();
  });
});

customAmount.addEventListener("input", () => {
  amountButtons.forEach(item => { item.classList.remove("selected"); item.setAttribute("aria-pressed", "false"); });
  updatePaymentDetails();
});

payButton.addEventListener("click", () => {
  if (!isMobileDevice()) {
    payStatus.textContent = "No UPI app on this device — scan the QR code below with your phone instead.";
    document.getElementById("qrcode").scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  payStatus.textContent = "Opening your UPI app…";
  window.location.href = createUpiLink();
  setTimeout(() => {
    if (document.hasFocus()) {
      payStatus.textContent = "Couldn't open a UPI app. Scan the QR code below, or copy the UPI ID.";
    }
  }, 1800);
});

copyButton.addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(upiId);
    copyButton.textContent = "UPI ID copied!";
  } catch (err) {
    copyButton.textContent = "Couldn't copy — please copy manually.";
  }
  setTimeout(() => { copyButton.textContent = "Copy UPI ID"; }, 2000);
});

updatePaymentDetails();
</script>
</body>
</html>
