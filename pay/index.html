<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Support Shijo — UPI</title>
<meta name="description" content="Support Shijo's work directly via UPI — works with any UPI app, no provider lock-in.">
<meta name="theme-color" content="#2A3EFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{
  --ink:#0b0b10; --cream:#fffdf6; --c-blue:#2a3eff; --c-yellow:#ffd100; --c-pink:#ff4d8d;
  --muted:#4a4a52;
  --font-display:'Archivo Black',sans-serif; --font-body:'DM Sans',sans-serif;
  --bw:3px; --shadow:6px 6px 0 var(--ink);
}
*{ box-sizing:border-box; }
body{
  margin:0; min-height:100vh; min-height:100svh; display:flex; justify-content:center; align-items:center;
  padding:24px; padding-top:calc(24px + env(safe-area-inset-top,0px)); padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  background:var(--c-blue); color:var(--ink); font-family:var(--font-body);
}
:focus-visible{ outline:3px solid var(--ink); outline-offset:2px; }
.container{ width:100%; max-width:440px; }
.back{ display:inline-flex; align-items:center; gap:6px; margin-bottom:24px; color:#fff; text-decoration:none; font-weight:700; font-size:13.5px; }
.eyebrow{ display:inline-flex; font-family:var(--font-body); font-weight:800; font-size:11px; text-transform:uppercase; letter-spacing:.06em; background:var(--ink); color:var(--cream); padding:6px 12px; border-radius:99px; margin-bottom:12px; }
h1{ margin:0 0 10px; font-family:var(--font-display); font-weight:400; font-size:clamp(1.8rem,6vw,2.4rem); text-transform:uppercase; color:#fff; }
.description{ color:#fff; opacity:.9; line-height:1.6; margin:0; font-weight:600; }
.card{ margin-top:24px; padding:22px; border:var(--bw) solid var(--ink); border-radius:18px; background:var(--cream); box-shadow:var(--shadow); display:flex; flex-direction:column; }
.pay-section{ order:1; } .qr-section{ order:2; margin-top:22px; }
@media (min-width:640px){ .pay-section{ order:2; margin-top:22px; } .qr-section{ order:1; margin-top:0; } }
.amounts{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.amount{ padding:12px 6px; border:2px solid var(--ink); border-radius:10px; color:var(--ink); background:#fff; cursor:pointer; font-weight:700; font-size:14px; transition:background .12s, transform .12s; }
.amount:hover, .amount.selected{ background:var(--c-yellow); transform:translate(1px,1px); }
input{ width:100%; margin-top:12px; padding:12px 13px; border:2px solid var(--ink); border-radius:10px; outline:none; color:var(--ink); background:#fff; font-family:var(--font-body); font-weight:600; font-size:14px; }
.pay-button{ width:100%; margin-top:14px; padding:15px; border:var(--bw) solid var(--ink); border-radius:12px; color:var(--ink); background:var(--c-yellow); cursor:pointer; font-weight:800; font-size:13.5px; text-transform:uppercase; box-shadow:4px 4px 0 var(--ink); transition:transform .12s, box-shadow .12s; }
.pay-button:hover{ transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink); }
.qr-caption{ margin:0 0 14px; font-weight:800; font-size:12.5px; text-transform:uppercase; }
#qrcode{ display:inline-block; padding:10px; border-radius:12px; background:#fff; border:2px solid var(--ink); }
.upi-id{ margin:14px 0 6px; color:var(--c-blue); font-weight:700; font-size:13px; }
.copy-button{ border:none; color:var(--muted); background:transparent; cursor:pointer; text-decoration:underline; font-weight:700; font-size:12.5px; }
.note{ margin-top:18px; color:var(--muted); font-size:11.5px; line-height:1.6; font-weight:500; }
.amount-error{ min-height:16px; margin:6px 2px 0; font-size:11.5px; font-weight:700; color:#c62828; }
.pay-button[disabled]{ opacity:.5; cursor:not-allowed; box-shadow:none; transform:none; }
.status{ min-height:18px; margin:10px 0 0; font-size:13px; color:var(--c-pink); font-weight:700; line-height:1.5; }
.visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
</style>
</head>
<body>
<div class="container">
  <a class="back" href="../">← Back to shijo.site</a>
  <div class="eyebrow">Support — UPI</div>
  <h1>Support my work</h1>
  <p class="description">Buy me a chaya :p — works with any UPI app, no provider lock-in.</p>

  <div class="card">
    <div class="pay-section">
      <div class="amounts" role="group" aria-label="Preset amounts">
        <button class="amount" data-amount="49" aria-pressed="false">₹49</button>
        <button class="amount selected" data-amount="99" aria-pressed="true">₹99</button>
        <button class="amount" data-amount="199" aria-pressed="false">₹199</button>
      </div>
      <label for="customAmount" class="visually-hidden">Custom amount in rupees</label>
      <input id="customAmount" type="number" min="1" max="20000" step="0.01" inputmode="decimal" placeholder="Or enter a custom amount (max ₹20,000)">
      <p class="amount-error" id="amountError" role="alert" aria-live="assertive"></p>
      <button class="pay-button" id="payButton" aria-describedby="payStatus">Pay ₹99 via UPI</button>
      <p class="status" id="payStatus" role="status" aria-live="polite"></p>
    </div>

    <div class="qr-section">
      <p class="qr-caption">Scan with any UPI app</p>
      <div id="qrcode" role="img" aria-label="UPI QR code for shijosylan@oksbi. Scan with Google Pay, PhonePe, Paytm, BHIM, or any UPI-enabled banking app."></div>
      <div class="upi-id">shijosylan@oksbi</div>
      <button class="copy-button" id="copyButton" aria-live="polite">Copy UPI ID</button>
    </div>

    <p class="note">On mobile, tap the payment button to open your UPI app. On desktop, scan the QR code with any UPI app on your phone.</p>
  </div>
</div>

<script>
const upiId = "shijosylan@oksbi";
const payeeName = "Shijo";
const MAX_AMOUNT = 20000;
const MIN_AMOUNT = 1;
const DEFAULT_AMOUNT = "99";

// Single source of truth for the active amount — previously a preset
// button click set `selectedAmount` while typing set `customAmount.value`
// independently, so clearing the custom field after typing silently fell
// back to a stale preset that no longer looked selected in the UI.
let activeAmount = DEFAULT_AMOUNT;

const amountButtons = document.querySelectorAll(".amount");
const customAmount = document.getElementById("customAmount");
const amountError = document.getElementById("amountError");
const payButton = document.getElementById("payButton");
const qrCodeBox = document.getElementById("qrcode");
const copyButton = document.getElementById("copyButton");
const payStatus = document.getElementById("payStatus");

function isMobileDevice() {
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

// Validates a raw amount string. Returns { value, error } — value is a
// clean numeric string (max 2 decimals) or null if there's no valid
// amount to send; error is a user-facing message or "".
function validateAmount(raw) {
  if (raw === "" || raw === null || raw === undefined) return { value: null, error: "" };
  const n = Number(raw);
  if (!Number.isFinite(n)) return { value: null, error: "Enter a valid number." };
  if (n > MAX_AMOUNT) return { value: null, error: `Amount can't exceed ₹${MAX_AMOUNT.toLocaleString("en-IN")}.` };
  // Round to paise (UPI's smallest unit) before the lower-bound check —
  // otherwise a sub-paisa value like 0.001 passes n > 0 but rounds to
  // "0.00", producing an invalid ₹0 payment request.
  const rounded = Math.round(n * 100) / 100;
  if (rounded < MIN_AMOUNT) return { value: null, error: `Amount must be at least ₹${MIN_AMOUNT}.` };
  return { value: rounded.toFixed(2).replace(/\.00$/, ""), error: "" };
}

function createUpiLink(amount) {
  const params = new URLSearchParams({ pa: upiId, pn: payeeName, cu: "INR" });
  if (amount) params.set("am", amount);
  return "upi://pay?" + params.toString();
}

function updatePaymentDetails() {
  const { value: amount, error } = validateAmount(activeAmount);
  amountError.textContent = error;
  payButton.disabled = !!error;

  payButton.textContent = amount ? `Pay ₹${amount} via UPI` : "Pay via UPI";
  qrCodeBox.innerHTML = "";
  // Never encode an amount that failed validation — display, QR payload,
  // and the pay button must always agree on the same value.
  new QRCode(qrCodeBox, {
    text: createUpiLink(error ? null : amount),
    width: 168,
    height: 168,
    colorDark: "#0b0b10",
    colorLight: "#ffffff"
  });
}

amountButtons.forEach(button => {
  button.addEventListener("click", () => {
    activeAmount = button.dataset.amount;
    customAmount.value = "";
    amountButtons.forEach(item => { item.classList.remove("selected"); item.setAttribute("aria-pressed", "false"); });
    button.classList.add("selected");
    button.setAttribute("aria-pressed", "true");
    updatePaymentDetails();
  });
});

customAmount.addEventListener("input", () => {
  amountButtons.forEach(item => { item.classList.remove("selected"); item.setAttribute("aria-pressed", "false"); });
  // An empty custom field means "no amount chosen" — fall back to the
  // default rather than silently reusing whatever was active before.
  activeAmount = customAmount.value !== "" ? customAmount.value : DEFAULT_AMOUNT;
  updatePaymentDetails();
});

payButton.addEventListener("click", () => {
  const { value: amount, error } = validateAmount(activeAmount);
  if (error) { amountError.textContent = error; customAmount.focus(); return; }

  if (!isMobileDevice()) {
    payStatus.textContent = "No UPI app on this device — scan the QR code below with your phone instead.";
    document.getElementById("qrcode").scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  payStatus.textContent = "Opening your UPI app…";
  window.location.href = createUpiLink(amount);
  setTimeout(() => {
    if (document.hasFocus()) {
      payStatus.textContent = "Couldn't open a UPI app. Scan the QR code below, or copy the UPI ID.";
    }
  }, 1800);
});

copyButton.addEventListener("click", async () => {
  try {
    if (!navigator.clipboard) throw new Error("Clipboard API unavailable");
    await navigator.clipboard.writeText(upiId);
    copyButton.textContent = "UPI ID copied!";
  } catch (err) {
    copyButton.textContent = "Couldn't copy — please copy manually.";
  }
  setTimeout(() => { copyButton.textContent = "Copy UPI ID"; }, 2000);
});

updatePaymentDetails();
</script>
</body>
</html>
